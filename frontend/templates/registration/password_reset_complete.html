{% extends "public/base.html" %}
{% load static core_extras %}

{% block title %}Password Reset Complete | {{ identity.name|default:SCHOOL_NAME }}{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" style="text-align:center">

    <div class="auth-card__icon auth-card__icon--success" style="margin:0 auto var(--pub-sp-4)">
      <span class="pub-icon pub-icon--xl" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"/></svg>
      </span>
    </div>

    <h1 class="auth-card__title">Password Reset!</h1>
    <p class="auth-card__sub" style="margin-bottom:var(--pub-sp-6)">
      Your password has been set. You can now sign in with your new password.
    </p>

    <a class="auth-submit" href="{% url 'accounts:login' %}" style="display:block;text-align:center;text-decoration:none">
      Sign In
    </a>

  </div>
</div>
{% endblock %}
