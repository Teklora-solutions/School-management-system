{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete | {{ SCHOOL_NAME }}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/5.3.3/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/1.11.3/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-card" style="text-align:center;">
    <div class="login-logo">
      <div class="login-logo-icon" style="background:linear-gradient(135deg,var(--color-success),#059669);">
        <i class="bi bi-check-circle-fill" style="color:#fff;"></i>
      </div>
      <h1 style="font-size:1.25rem;">Password Reset!</h1>
      <p style="color:var(--color-muted);font-size:0.875rem;">Your password has been set. You can now sign in.</p>
    </div>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 mt-3" style="font-weight:700;">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </a>
  </div>
</div>
<script src="{% static 'vendor/bootstrap/5.3.3/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
