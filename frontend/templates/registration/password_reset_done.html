{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Email Sent | {{ SCHOOL_NAME }}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/5.3.3/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/1.11.3/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-card" style="text-align:center;">
    <div class="login-logo">
      <div class="login-logo-icon" style="background:linear-gradient(135deg,var(--color-success),#059669);">
        <i class="bi bi-envelope-check-fill" style="color:#fff;"></i>
      </div>
      <h1 style="font-size:1.25rem;">Email Sent!</h1>
      <p style="color:var(--color-muted);font-size:0.875rem;max-width:300px;margin:0 auto;">
        If an account with that email exists, a password reset link has been sent. Check your inbox.
      </p>
    </div>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary w-100 mt-3">
      <i class="bi bi-arrow-left me-2"></i>Back to Login
    </a>
  </div>
</div>
<script src="{% static 'vendor/bootstrap/5.3.3/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
