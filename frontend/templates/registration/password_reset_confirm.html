{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | {{ SCHOOL_NAME }}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/5.3.3/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/1.11.3/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon" style="background:linear-gradient(135deg,var(--accent),var(--accent-dark));">
        <i class="bi bi-key-fill" style="color:#fff;"></i>
      </div>
      <h1 style="font-size:1.25rem;">Set New Password</h1>
    </div>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div style="color:var(--color-danger);font-size:0.8rem;">{{ field.errors.0 }}</div>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary w-100 py-2" style="font-weight:700;">
        <i class="bi bi-check-circle me-2"></i>Set Password
      </button>
    </form>
  </div>
</div>
<script src="{% static 'vendor/bootstrap/5.3.3/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
