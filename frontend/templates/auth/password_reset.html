{# auth/password_reset.html — uses Django built-in password reset views #}
{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | {{ SCHOOL_NAME }}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/5.3.3/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/1.11.3/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon" style="background:linear-gradient(135deg,var(--color-info),#1d4ed8);">
        <i class="bi bi-envelope-fill" style="color:#fff;"></i>
      </div>
      <h1 style="font-size:1.25rem;">Reset Your Password</h1>
      <p style="color:var(--color-muted);font-size:0.875rem;">Enter your email address to receive a reset link.</p>
    </div>
    <form method="post" id="pw-reset-form">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_email" class="form-label">Email Address</label>
        <input type="email" name="email" id="id_email" class="form-control"
               placeholder="you@school.edu" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2" style="font-weight:700;">
        <i class="bi bi-send me-2"></i>Send Reset Link
      </button>
    </form>
    <p style="text-align:center;margin-top:1.25rem;font-size:0.8125rem;color:var(--color-muted);">
      <a href="{% url 'accounts:login' %}" style="color:var(--accent-light);">
        <i class="bi bi-arrow-left me-1"></i>Back to login
      </a>
    </p>
  </div>
</div>
<script src="{% static 'vendor/bootstrap/5.3.3/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/base.js' %}"></script>
</body>
</html>
