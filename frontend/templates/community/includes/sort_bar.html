{% comment %}Sort control. Expects: sort, active_category_slug{% endcomment %}
<details class="cmty-sort" id="cmtySort">
  <summary class="cmty-sort__trigger" aria-label="Change sort order">
    <i class="bi bi-arrow-down-up" aria-hidden="true"></i>
    <span class="cmty-sort__value">
      {% if sort == 'top' %}Top this week{% elif sort == 'pinned' %}Pinned{% else %}Newest{% endif %}
    </span>
  </summary>
  <div class="cmty-sort__menu" role="group" aria-label="Sort posts">
    {% with base_url=request.path %}
    <a href="{{ base_url }}?sort=new&cat={{ active_category_slug|default:'all' }}"
       class="cmty-sort__item {% if sort == 'new' or not sort %}is-active{% endif %}">
      <i class="bi bi-clock" aria-hidden="true"></i> Newest
    </a>
    <a href="{{ base_url }}?sort=top&cat={{ active_category_slug|default:'all' }}"
       class="cmty-sort__item {% if sort == 'top' %}is-active{% endif %}">
      <i class="bi bi-fire" aria-hidden="true"></i> Top this week
    </a>
    <a href="{{ base_url }}?sort=pinned&cat={{ active_category_slug|default:'all' }}"
       class="cmty-sort__item {% if sort == 'pinned' %}is-active{% endif %}">
      <i class="bi bi-pin" aria-hidden="true"></i> Pinned only
    </a>
    {% endwith %}
  </div>
</details>
