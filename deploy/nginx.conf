user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    # Re-resolve app after container recreation instead of retaining its old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream django {
        zone django 64k;
        server app:8000 resolve;
    }

    server {
        # Container-only listener; Compose never publishes it on the host.
        listen 8080;
        server_name _;
        client_max_body_size 64m;

        location /static/ {
            alias /srv/static/;
            autoindex off;
            add_header X-Content-Type-Options nosniff always;
        }

        # Only explicitly public media is exposed. Finance documents, imports,
        # messages and pupil submissions must not become anonymous downloads.
        location /media/school/logo/ {
            alias /srv/media/school/logo/;
            autoindex off;
            add_header X-Content-Type-Options nosniff always;
        }
        location /media/gallery/ {
            alias /srv/media/gallery/;
            autoindex off;
            add_header X-Content-Type-Options nosniff always;
        }
        location /media/ {
            return 404;
        }

        # Readiness details are for the container healthcheck, not the Internet.
        location = /readyz/ {
            return 404;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            # HTTPS terminates at Cloudflare. This origin has no public listener.
            # Do not trust a client-supplied scheme and accidentally redirect-loop.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_read_timeout 120s;
            proxy_redirect off;
        }
    }
}
